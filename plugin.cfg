# KILN_AFCLite: the AD5X IFS as an AFC unit on Kiln OS, for the AFC panels in
# Mainsail and Fluidd and for HelixScreen. See README.md.
#
# Kiln includes this file while the plugin is enabled, and plugin updates
# replace it. To change an option, add a [kiln_afclite] section of your own
# to local.cfg; Klipper merges both sections, and yours win.
#
# All options and their defaults:
#
#   default_weight: 1000
#       Grams shown for lanes without a weight (SET_WEIGHT). Mainsail's and
#       Fluidd's filament dialogs only apply a color or material to a lane
#       that has one. 0 hides weights.
#   spoolman_clear_on_empty: True
#       Forget a lane's Spoolman spool once its filament is pulled out.
#   spoolman_set_temperature: True
#       SET_SPOOL_ID also sets the slot's nozzle temperature from Spoolman.
#   moonraker_url: http://127.0.0.1:7125
#   head_sensor: adc_filament_sensor toolhead

[kiln_afclite]

# _AFC_LANE_OP (kiln_afclite.py) runs _AFC_KILN_LANE below and reports it as
# AFC's current_state, and an IFS error (a stall) as its error_state and
# message. As in AFC: CHANGE_TOOL loads a lane into the toolhead, TOOL_UNLOAD
# takes it out of the toolhead (without LANE: the lane in the toolhead), and
# LANE_UNLOAD (Eject) pulls a lane's filament out of the IFS.
[gcode_macro CHANGE_TOOL]
description: Load an IFS lane through the AFC lane interface
gcode:
    _AFC_LANE_OP ACTION=load {'LANE=' ~ params.LANE if params.LANE else ''}

[gcode_macro TOOL_UNLOAD]
description: Unload the IFS lane in the toolhead through the AFC lane interface
gcode:
    _AFC_LANE_OP ACTION=unload {'LANE=' ~ params.LANE if params.LANE else ''}

[gcode_macro LANE_UNLOAD]
description: Eject an IFS lane through the AFC lane interface
gcode:
    _AFC_LANE_OP ACTION=eject {'LANE=' ~ params.LANE if params.LANE else ''}

# Load, unload or eject a lane with Kiln's own IFS commands. IFS_LOAD and
# IFS_UNLOAD move the toolhead to the purge box, so the printer is homed
# first if it is not; they heat the nozzle for the slot's material and put
# the old target back afterwards. IFS_EJECT of a lane that is not in the
# toolhead only moves the IFS.
[gcode_macro _AFC_KILN_LANE]
gcode:
    {% set lane = printer['AFC_lane ' ~ params.LANE|string] %}
    {% set slot = lane.ifs_slot|int %}
    {% set action = params.ACTION|default('load')|lower %}
    {% set moves_head = action != 'eject' or printer.ifs.channel == slot %}
    {% if moves_head and 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if action == 'load' %}
        IFS_LOAD SLOT={slot}
    {% elif action == 'unload' %}
        IFS_UNLOAD SLOT={slot}
    {% else %}
        IFS_EJECT SLOT={slot}
    {% endif %}

# Klipper strips everything after '#' as a comment, even inside Jinja strings,
# so the macros below spell it as the escape '\x23'.
[gcode_macro SET_COLOR]
description: Set an IFS lane's color
gcode:
    {% set lane = printer['AFC_lane ' ~ params.LANE|default('E0')|string|upper] %}
    {% set color = params.COLOR|default('')|replace('\x23', '')|upper %}
    {% if color|length == 8 %}
        {% set color = color[:6] %}
    {% endif %}
    # HelixScreen clears a lane with an empty SET_MATERIAL, SET_COLOR and
    # SET_WEIGHT WEIGHT=0; an empty COLOR leaves the slot's color as it is.
    {% if color|length == 0 %}
        RESPOND PREFIX="info" MSG="{lane.name}: no color given, the slot keeps its color."
    {% elif color|length != 6 %}
        { action_raise_error("COLOR must be 6-digit RGB or 8-digit RGBA hex.") }
    {% else %}
        IFS_SET_MATERIAL SLOT={lane.ifs_slot} COLOR={color}
    {% endif %}

[gcode_macro SET_MATERIAL]
description: Set an IFS lane's material
# Kiln accepts any material name of up to 16 letters, digits and +_.- (a
# typed space becomes -). Names in Kiln's temperature list (IFS_MATERIALS,
# temp_<type> in [ifs]) also set the slot's handling temperature.
gcode:
    {% set lane = printer['AFC_lane ' ~ params.LANE|default('E0')|string|upper] %}
    {% set material = params.MATERIAL|default('')|string|upper|trim|replace(' ', '-') %}
    {% if params.SUBTYPE|default('')|string|length > 0 %}
        { action_raise_error("The IFS does not store AFC material subtypes.") }
    {% endif %}
    {% if params.VENDOR|default('')|string|length > 0 %}
        { action_raise_error("The IFS does not store AFC filament vendors.") }
    {% endif %}
    {% if not material %}
        # An empty MATERIAL is HelixScreen clearing the lane (see SET_COLOR).
        RESPOND PREFIX="info" MSG="{lane.name}: no material given, the slot keeps its material."
    {% else %}
        IFS_SET_MATERIAL SLOT={lane.ifs_slot} TYPE={material}
    {% endif %}

[gcode_macro SET_VENDOR]
gcode:
    { action_raise_error("The IFS does not store AFC filament vendors.") }

# AFC's lane-to-tool map is Kiln's per-print tool map (IFS_MAP_TOOL), which
# only takes a slot that holds filament and goes back to T0-T3 -> slots 1-4
# with IFS_MAP_TOOL RESET=1.
[gcode_macro SET_MAP]
description: Aim a slicer tool at an IFS lane (IFS_MAP_TOOL)
gcode:
    {% set lane = printer['AFC_lane ' ~ params.LANE|default('E0')|string|upper] %}
    {% set map = params.MAP|default('')|string|upper|replace('T', '') %}
    {% if not map or not map.isdigit() %}
        { action_raise_error("MAP must be a tool such as T0.") }
    {% endif %}
    IFS_MAP_TOOL TOOL={map} SLOT={lane.ifs_slot}

[gcode_macro SET_WEIGHT]
description: Set the filament weight shown for an AFC lane
# The IFS does not measure filament; this only stores what the user entered,
# in save_variables under kiln_afclite_weight_<lane> (see
# WEIGHT_VARIABLE_PREFIX).
gcode:
    {% set lane_name = params.LANE|default('E0')|string|upper %}
    {% set lane = printer['AFC_lane ' ~ lane_name] %}
    {% set weight = params.WEIGHT|default(-1)|float %}
    {% if weight < 0 %}
        { action_raise_error("WEIGHT must be a weight in grams (0 or more).") }
    {% endif %}
    {% if 'save_variables' in printer %}
        # WEIGHT=0 is how AFC (and HelixScreen's lane clear) empties a lane. It
        # goes back to the default weight, because Mainsail's filament dialog
        # keeps Set disabled for a lane that reports no weight.
        SAVE_VARIABLE VARIABLE=kiln_afclite_weight_{lane_name|lower} VALUE={weight|round|int if weight > 0 else 'None'}
    {% else %}
        RESPOND PREFIX="info" MSG="No [save_variables] configured, so the lane weight was not saved."
    {% endif %}
